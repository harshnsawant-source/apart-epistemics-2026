name: collect
# Registered for the AI x Epistemics sprint, 13-16 Nov 2026.

# Every hour: continue the gpt-oss collection where it stopped, label new titles, run stage two when ready,
# and commit the results back. Does nothing until FREEZE.md exists; the script itself also refuses to
# collect before the sprint kickoff (config.json: collect_not_before_utc).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python tests/test_audit.py
      - name: Collect and stage two (labelling runs on the laptop)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ ! -f FREEZE.md ]; then echo "Plan not frozen yet; nothing to do."; exit 0; fi
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          save() {
            git add -A
            if git diff --cached --quiet; then echo "SAVE: nothing new"; return 0; fi
            git commit -q -m "collect: progress $(date -u +%Y-%m-%dT%H:%MZ) ($1)"
            for i in 1 2 3 4 5; do
              if git pull -q --rebase && git push -q; then echo "SAVE: pushed ($1)"; return 0; fi
              sleep 10
            done
            echo "SAVE FAILED ($1)"; return 1
          }
          python src/run.py --arm gptoss --minutes 22 --no-lookup || true
          save gptoss
          python src/run.py --arm qwen --minutes 8 --no-lookup || true
          save qwen
          if [ -n "$NVIDIA_API_KEY" ]; then python src/run.py --arm nemotron --minutes 8 --no-lookup || true; fi
          save nemotron
          python src/run.py --label --minutes 9 || true
          save labels
      - name: Save anything left (also runs if the job is cancelled or times out)
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "SAVE: nothing new"; exit 0; fi
          git commit -q -m "collect: final save $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && echo "SAVE: pushed" && exit 0; sleep 10; done
          echo "SAVE FAILED"; exit 1
      - name: Start the next run while collection is unfinished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(python tools/status.py | tail -1)
          python tools/status.py | head -1
          if [ "$state" = "MORE" ]; then gh workflow run collect.yml --ref master && echo "NEXT RUN QUEUED"; else echo "COLLECTION COMPLETE OR CLOSED"; fi
