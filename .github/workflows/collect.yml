name: collect

# Every hour: continue the gpt-oss collection where it stopped, label new titles, run stage two when ready,
# and commit the results back. Does nothing until FREEZE.md exists; the script itself also refuses to
# collect before the sprint kickoff (config.json: collect_not_before_utc).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks
        run: python tests/test_audit.py
      - name: Collect, label, stage two
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ ! -f FREEZE.md ]; then echo "Plan not frozen yet; nothing to do."; exit 0; fi
          python src/run.py --arm gptoss --minutes 45
      - name: Save progress
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw data results 2>/dev/null || true
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "collect: progress $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
